server {
 listen 8080;
 server_tokens off;
 root /usr/share/nginx/html;
 add_header X-Content-Type-Options nosniff always;
 add_header X-Frame-Options DENY always;
 add_header Referrer-Policy no-referrer always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
 location /v1/ { proxy_pass http://api:8080; proxy_connect_timeout 5s; proxy_read_timeout 10s; }
 location / { try_files $uri $uri/ /index.html; }
}
