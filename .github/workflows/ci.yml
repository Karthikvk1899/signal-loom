name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.lock && pip install --no-deps -e .
      - run: ruff check loom tests scripts
      - run: pytest -q -m 'not integration' --cov=loom --cov-report=term-missing
      - run: pip-audit -r requirements.lock
  console:
    runs-on: ubuntu-24.04
    defaults: {run: {working-directory: ui}}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: ui/package-lock.json}
      - run: npm ci
      - run: npm test && npm run build
      - run: npm audit --audit-level=high
  docker-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: python3 scripts/init_env.py
      - run: docker compose config --quiet && docker compose up -d --build --wait
      - run: docker compose --profile test run --rm integration
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Real browser release workflow
        run: |
          set -a
          . ./.env
          set +a
          cd ui
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            ui/test-results/
            ui/playwright-report/
      - name: Verify UI and database outage recovery
        run: |
          curl --fail http://localhost:3000/ | grep 'Signal Loom'
          docker compose stop db
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/health/ready)
          test "$code" = 503
          docker compose start db
          for i in $(seq 1 30); do curl -fsS http://localhost:8080/health/ready && break; sleep 2; done
          curl --fail http://localhost:8080/health/ready
          docker compose --profile test run --rm integration
      - name: Diagnostics
        if: failure()
        run: docker compose --profile test logs --no-color --tail=150
      - name: Cleanup
        if: always()
        run: docker compose --profile test down -v
  codeql:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    strategy:
      matrix: {language: [python, javascript-typescript]}
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@v4
