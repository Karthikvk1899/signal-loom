name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: '3.12'}
      - run: pip install -r requirements.lock && pip install --no-deps -e .
      - run: ruff check loom tests scripts
      - run: python scripts/export_contract.py && git diff --exit-code docs/openapi.json
      - run: pytest -q -m 'not integration' --cov=loom --cov-report=term-missing
      - run: pip-audit -r requirements.lock
  console:
    runs-on: ubuntu-24.04
    defaults: {run: {working-directory: ui}}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: '22', cache: npm, cache-dependency-path: ui/package-lock.json}
      - run: npm ci
      - run: npm test && npm run build
      - run: npm audit --audit-level=high
  docker-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 scripts/init_env.py
      - run: docker compose config --quiet && docker compose up -d --build --wait
      - run: docker compose --profile test run --rm integration
      - name: Verify documented quick-start seed
        run: docker compose exec -T api python scripts/seed.py > /dev/null
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: '22'}
      - name: Real browser release workflow
        run: |
          set -a
          . ./.env
          set +a
          cd ui
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: browser-evidence
          path: |
            ui/test-results/
            ui/playwright-report/
      - name: Verify UI and database outage recovery
        run: |
          curl --fail http://localhost:3000/ | grep 'Signal Loom'
          docker compose stop db
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/health/ready)
          test "$code" = 503
          docker compose start db
          for i in $(seq 1 30); do curl -fsS http://localhost:8080/health/ready && break; sleep 2; done
          curl --fail http://localhost:8080/health/ready
          docker compose --profile test run --rm integration
      - name: Diagnostics
        if: failure()
        run: docker compose --profile test logs --no-color --tail=150
      - name: Cleanup
        if: always()
        run: docker compose --profile test down -v
  codeql:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    strategy:
      matrix: {language: [python, javascript-typescript]}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
