name: Publish source
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  publish:
    if: github.actor == 'Karthikvk1899'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Materialize reviewed source
        run: |
          python3 - <<'PYTHON'
          import base64, json, pathlib, zlib
          files = json.loads(zlib.decompress(base64.b64decode('')))
          for name, content in files.items():
              path = pathlib.Path(name)
              assert not path.is_absolute() and '..' not in path.parts
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(content)
          PYTHON
          git config user.name "Karthik Beesa"
          git config user.email "261053759+Karthikvk1899@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "Implement reviewed releases, signed SDK, console, tests and operations"
          git push
